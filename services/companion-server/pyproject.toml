[project]
name = "lingou-companion-server"
version = "0.1.0"
description = "Lingou Soul Companion Server"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.110.0,<1",
    "uvicorn[standard]>=0.29.0,<1",
    "pydantic>=2.6.0,<3",
    "python-multipart>=0.0.9,<1",
    "httpx>=0.27.0,<1",
    "python-dotenv>=1.0.0,<2",
    "pyserial>=3.5,<4",
    "websockets>=14,<16",
    "bcrypt>=4.3,<5",
    "PyJWT>=2,<3",
    "email-validator>=2,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "data*"]

[tool.uvicorn]
host = "0.0.0.0"
port = 8000
reload = true
